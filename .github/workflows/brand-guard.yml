name: Everly brand guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  everly-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block non-Everly brand drift
        run: python scripts/brand_guard.py
