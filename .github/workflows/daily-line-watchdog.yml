name: Daily LINE watchdog

# Schedule disabled: Everly midnight LINE delivery now runs through the
# production cron sender with persistent state and duplicate-send protection.
# Keep workflow_dispatch only for manual debugging.
on:
  workflow_dispatch:

concurrency:
  group: daily-line-watchdog
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Everly cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          URL="https://everly-clinic.onrender.com/api/cron/run"
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "X-Cron-Secret: $CRON_SECRET")
          else
            echo "  ✗ CRON_SECRET GitHub secret is required"
            exit 1
          fi
          RESP=$(curl -s --fail --max-time 90 -X POST "$URL" \
            -H "Content-Type: application/json" \
            "${AUTH_HEADER[@]}")
          echo "$RESP"
          if echo "$RESP" | grep -q '"ok":true' && echo "$RESP" | grep -Eq '"daily_report":"(sent|already_sent)"'; then
            echo "  ✓ daily report sent or already sent"
            exit 0
          fi
          echo "  ✗ daily report was not sent or marked already_sent"
          exit 1
