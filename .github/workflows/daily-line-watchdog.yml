name: Daily LINE watchdog

# Independent backup for the Everly midnight LINE report.
# Calls the same idempotent /api/cron/run endpoint as the primary workflow.
on:
  schedule:
    - cron: '30 17 * * *' # 00:30 BKK
    - cron: '30 18 * * *' # 01:30 BKK
    - cron: '30 19 * * *' # 02:30 BKK
    - cron: '30 23 * * *' # 06:30 BKK
  workflow_dispatch:

concurrency:
  group: daily-line-watchdog
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Everly cron endpoint
        run: |
          set -e
          URL="https://everly-clinic.onrender.com/api/cron/run"
          RESP=$(curl -s --fail --max-time 90 -X POST "$URL" -H "Content-Type: application/json")
          echo "$RESP"
          if echo "$RESP" | grep -q '"ok":true' && echo "$RESP" | grep -Eq '"daily_report":"(sent|already_sent)"'; then
            echo "  ✓ daily report sent or already sent"
            exit 0
          fi
          echo "  ✗ daily report was not sent or marked already_sent"
          exit 1
