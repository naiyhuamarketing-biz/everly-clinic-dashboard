name: Daily LINE notification

# Fires every day around midnight Bangkok time (17:00 UTC).
# GitHub can delay/drop scheduled jobs near the top of the hour, so the
# midnight hour retries every 5 minutes. The API has a per-date idempotency
# guard, so backup runs skip if an earlier run already sent the report.
# Free on GitHub Actions for public repos — runs on GitHub's servers,
# does NOT depend on the user's Mac being on.
#
# Reliability features:
#   - Pre-warm Render dyno before sending (avoids cold-start timeout)
#   - 5-retry policy with exponential backoff
#   - Concurrency lock so two cron firings don't double-send
on:
  schedule:
    - cron: '*/5 17 * * *' # 00:00-00:55 BKK retries every 5 minutes
    - cron: '20 18 * * *'  # 01:20 BKK backup for GitHub queue delay
    - cron: '20 19 * * *'  # 02:20 BKK backup for GitHub queue delay
    - cron: '20 20 * * *'  # 03:20 BKK backup for GitHub queue delay
    - cron: '20 21 * * *'  # 04:20 BKK backup for GitHub queue delay
    - cron: '20 22 * * *'  # 05:20 BKK backup for GitHub queue delay
    - cron: '20 23 * * *'  # 06:20 BKK backup for GitHub queue delay
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: daily-line
  cancel-in-progress: false  # let pending runs finish (don't lose a daily report)

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pre-warm Render
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null --max-time 90 -w "%{http_code}" \
                   "https://everly-clinic.onrender.com/api/health" || echo "000")
            echo "wake attempt $i: $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done

      - name: Send daily LINE
        run: |
          set -e
          URL="https://everly-clinic.onrender.com/api/everly/send-daily-line"
          for i in 1 2 3 4 5; do
            echo "attempt $i ..."
            RESP=$(curl -s --max-time 60 -X POST "$URL" -H "Content-Type: application/json")
            echo "$RESP" | head -c 500
            echo
            if echo "$RESP" | grep -q '"outside_auto_send_window"'; then
              echo "  ✗ outside midnight send window"
              exit 1
            fi
            if echo "$RESP" | grep -q '"ok":true' && echo "$RESP" | grep -q '"reason":"already_sent"'; then
              echo "  ✓ already sent by an earlier cron run"
              exit 0
            fi
            if echo "$RESP" | grep -q '"ok":true' && ! echo "$RESP" | grep -q '"skipped":true'; then
              echo "  ✓ sent"
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "  ✗ all retries failed"
          exit 1
