name: Daily LINE notification

on:
  schedule:
    # 00:00 BKK primary send, with near-midnight backups.
    # The API is idempotent per report date, so later runs skip after success.
    - cron: '0 17 * * *'
    - cron: '9 17 * * *'
    - cron: '29 17 * * *'
    - cron: '49 17 * * *'
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: everly-daily-line
  cancel-in-progress: false  # let pending runs finish (don't lose a daily report)

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pre-warm Render
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null --max-time 90 -w "%{http_code}" \
                   "https://everly-clinic.onrender.com/api/health" || echo "000")
            echo "wake attempt $i: $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done

      - name: Send daily LINE
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          URL="https://everly-clinic.onrender.com/api/cron/run"
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "X-Cron-Secret: $CRON_SECRET")
          else
            echo "  ✗ CRON_SECRET GitHub secret is required"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            echo "attempt $i ..."
            RESP=$(curl -s --max-time 60 -X POST "$URL" \
              -H "Content-Type: application/json" \
              "${AUTH_HEADER[@]}")
            echo "$RESP" | head -c 500
            echo
            if echo "$RESP" | grep -q '"outside_daily_send_window"'; then
              echo "  ✗ outside midnight send window"
              exit 1
            fi
            if echo "$RESP" | grep -q '"ok":true' && echo "$RESP" | grep -q '"daily_report":"already_sent"'; then
              echo "  ✓ already sent by an earlier cron run"
              exit 0
            fi
            if echo "$RESP" | grep -q '"ok":true' && echo "$RESP" | grep -q '"daily_report":"sent"'; then
              echo "  ✓ sent"
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "  ✗ all retries failed"
          exit 1
