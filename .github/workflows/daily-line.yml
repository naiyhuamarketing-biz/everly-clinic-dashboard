name: Daily LINE notification

# Fires every day at 23:59 Bangkok time (16:59 UTC).
# Free on GitHub Actions for public repos — runs on GitHub's servers,
# does NOT depend on the user's Mac being on.
on:
  schedule:
    - cron: '59 16 * * *'
  workflow_dispatch:  # also allow manual trigger from GitHub UI

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ping daily-line endpoint
        run: |
          set -e
          URL="https://everly-clinic.onrender.com/api/everly/send-daily-line"
          echo "POSTing to $URL"
          # Wake the Render free dyno up first (cold start may take 30s)
          curl --max-time 90 --silent --output /dev/null --write-out "wake: %{http_code}\n" \
               "https://everly-clinic.onrender.com/api/health" || true
          sleep 5
          curl --fail --max-time 90 --retry 3 --retry-delay 10 \
               -X POST "$URL" \
               -H "Content-Type: application/json"
          echo "  → done"
