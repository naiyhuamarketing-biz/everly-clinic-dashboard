name: Health monitor

# Every 6 hours, deep-check the entire pipeline:
#   - Render dashboard responds
#   - Meta API works (via keepalive endpoint)
#   - LINE messaging is configured
# If anything fails → POST alert to LINE group.
#
# Why 6h not 30min? Render keepalive already runs every 14min; this is
# the "deep" check that catches subtle issues (Meta API errors, LINE
# config drift) without spamming the LINE group.
on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours UTC
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null --max-time 90 -w "%{http_code}" \
                   "https://everly-clinic.onrender.com/api/health" || echo "000")
            echo "wake $i: $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done

      - name: Deep health check
        id: check
        run: |
          set +e
          ALERTS=""

          # 1. Health endpoint
          H=$(curl -s --max-time 30 "https://everly-clinic.onrender.com/api/health")
          if ! echo "$H" | grep -q '"ok":true'; then
            ALERTS="$ALERTS%0A• /api/health failed"
          fi

          # 2. Keepalive (verifies Meta API connectivity)
          K=$(curl -s --max-time 60 "https://everly-clinic.onrender.com/api/everly/keepalive")
          if ! echo "$K" | grep -q '"ok":true'; then
            ALERTS="$ALERTS%0A• Meta API call failed (keepalive)"
            ERR=$(echo "$K" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('error',''))" 2>/dev/null | head -c 200)
            [ -n "$ERR" ] && ALERTS="$ALERTS%0A  → $ERR"
          fi

          # 3. LINE configured
          L=$(curl -s --max-time 30 "https://everly-clinic.onrender.com/api/line/status")
          if ! echo "$L" | grep -q '"configured":true'; then
            ALERTS="$ALERTS%0A• LINE config drift"
          fi

          # 4. Daily report guard. During the report window, dry-run tells us
          # whether the previous report is still missing. If missing, rescue it.
          D=$(curl -s --max-time 60 "https://everly-clinic.onrender.com/api/cron/run?dry_run=true")
          echo "$D"
          if echo "$D" | grep -q '"within_window":true' && echo "$D" | grep -q '"already_sent":false'; then
            R=$(curl -s --max-time 90 -X POST "https://everly-clinic.onrender.com/api/cron/run")
            echo "$R"
            if ! echo "$R" | grep -Eq '"daily_report":"(sent|already_sent)"'; then
              ALERTS="$ALERTS%0A• Daily LINE report missing and rescue failed"
            fi
          fi

          if [ -n "$ALERTS" ]; then
            echo "alerts=true" >> "$GITHUB_OUTPUT"
            BODY="🚨 Everly Clinic · HEALTH CHECK FAILED${ALERTS}%0A%0Ahttps://everly-clinic.onrender.com"
            echo "$BODY"
            DECODED=$(printf '%s' "$BODY" | sed 's/%0A/\n/g')
            curl --fail --max-time 30 \
              -X POST "https://everly-clinic.onrender.com/api/line/send" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'text': sys.argv[1]}))" "$DECODED")" \
              || echo "(LINE send also failed — system is in degraded state)"
            exit 1
          else
            echo "  ✓ all systems healthy"
          fi
