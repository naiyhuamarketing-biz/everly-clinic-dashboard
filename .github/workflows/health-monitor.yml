name: TUBA health monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tuba-health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep health check
        run: |
          set +e
          ALERTS=""
          H=$(curl -s --max-time 60 "https://everly-clinic.onrender.com/api/health")
          if ! echo "$H" | grep -q '"ok":true'; then
            ALERTS="$ALERTS%0A• /api/health failed"
          fi
          K=$(curl -s --max-time 60 "https://everly-clinic.onrender.com/api/tuba/keepalive")
          if ! echo "$K" | grep -q '"ok":true'; then
            ALERTS="$ALERTS%0A• TUBA Meta keepalive failed"
          fi
          L=$(curl -s --max-time 30 "https://everly-clinic.onrender.com/api/line/status")
          if ! echo "$L" | grep -q '"configured":true'; then
            ALERTS="$ALERTS%0A• TUBA LINE config drift"
          fi
          if [ -n "$ALERTS" ]; then
            MSG="TUBA · HEALTH CHECK FAILED${ALERTS}%0A%0Ahttps://everly-clinic.onrender.com/dashboard"
            DECODED=$(printf '%s' "$MSG" | sed 's/%0A/\n/g')
            echo "LINE alert disabled for safety. Admin-only alert text:"
            printf '%s\n' "$DECODED"
            exit 1
          fi
          echo "TUBA systems healthy"
