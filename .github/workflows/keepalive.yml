name: Light health ping

# Pings the keepalive endpoint:
#   1. Confirms Render is reachable
#   2. Does not send LINE reports; midnight delivery is handled by the
#      production cron sender with persistent state.
#
on:
  schedule:
    # Every 6 hours for general health.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Cancel pending pings if a new one starts (avoid pile-up)
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping lightweight endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://everly-clinic.onrender.com/api/everly/keepalive"
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "X-Cron-Secret: $CRON_SECRET")
          else
            echo "  ✗ CRON_SECRET GitHub secret is required"
            exit 1
          fi
          # Allow up to 90s for cold-start wake; ignore non-200 (don't fail action)
          STATUS=$(curl -s -o /tmp/body --max-time 90 -w "%{http_code}" \
            "${AUTH_HEADER[@]}" "$URL" || echo "000")
          echo "HTTP $STATUS"
          cat /tmp/body 2>/dev/null | head -c 500 || true
          echo
