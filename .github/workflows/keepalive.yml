name: TUBA light health ping

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tuba-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping TUBA keepalive
        run: |
          URL="https://everly-clinic.onrender.com/api/tuba/keepalive"
          STATUS=$(curl -s -o /tmp/body --max-time 90 -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $STATUS"
          cat /tmp/body 2>/dev/null | head -c 500 || true
          echo
