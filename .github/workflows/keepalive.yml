name: Light health ping

# Pings the keepalive endpoint:
#   1. Confirms Render is reachable
#   2. Provides an independent daily LINE backup during the midnight window
#      via /api/everly/keepalive's idempotent auto-send check
#
on:
  schedule:
    # Every 6 hours for general health.
    - cron: '0 */6 * * *'
    # Midnight BKK backup window. This workflow has been more reliable than
    # the dedicated daily-line workflow, and the API prevents duplicate sends.
    - cron: '59 16 * * *' # 23:59 BKK
    - cron: '*/5 17 * * *' # 00:00-00:55 BKK
    - cron: '20 18 * * *'  # 01:20 BKK
  workflow_dispatch:

# Cancel pending pings if a new one starts (avoid pile-up)
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping lightweight endpoint
        run: |
          URL="https://everly-clinic.onrender.com/api/everly/keepalive"
          # Allow up to 90s for cold-start wake; ignore non-200 (don't fail action)
          STATUS=$(curl -s -o /tmp/body --max-time 90 -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $STATUS"
          cat /tmp/body 2>/dev/null | head -c 500 || true
          echo
