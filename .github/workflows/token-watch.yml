name: TUBA token expiry watcher

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: tuba-token-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check TUBA token expiry
        run: |
          set -e
          INFO=$(curl -s --max-time 60 "https://everly-clinic.onrender.com/api/tuba/token-info")
          echo "$INFO"
          DAYS=$(echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('days_left', -1))")
          VALID=$(echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('is_valid', False))")
          if [ "$VALID" != "True" ]; then
            MSG="TUBA · TOKEN INVALID%0AFB token reports is_valid=false.%0Ahttps://everly-clinic.onrender.com/api/tuba/token-info"
            ALERT=1
          elif [ "$DAYS" -lt 7 ]; then
            MSG="TUBA · TOKEN EXPIRES IN $DAYS DAYS%0Aต้อง refresh ทันที%0Ahttps://everly-clinic.onrender.com/api/tuba/token-info"
            ALERT=1
          elif [ "$DAYS" -lt 14 ]; then
            MSG="TUBA · TOKEN EXPIRES IN $DAYS DAYS%0Aควรเตรียม refresh เร็ว ๆ นี้%0Ahttps://everly-clinic.onrender.com/api/tuba/token-info"
            ALERT=1
          else
            ALERT=0
            echo "token healthy"
          fi
          if [ "$ALERT" = "1" ]; then
            DECODED=$(printf '%s' "$MSG" | sed 's/%0A/\n/g')
            echo "LINE alert disabled for safety. Admin-only alert text:"
            printf '%s\n' "$DECODED"
          fi
