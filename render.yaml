# Render blueprint — TUBA dashboard
# Web service only on free tier (cron jobs require paid plan).
# Daily LINE notification is handled by GitHub Actions cron (.github/workflows/daily-line.yml).
#
# Env vars set via Render dashboard (NOT committed):
#   FB_ACCESS_TOKEN, FB_APP_ID, FB_APP_SECRET, FB_ACCOUNT_TUBA=1979003202592442
#   LINE_CHANNEL_ACCESS_TOKEN, LINE_GROUP_ID_TUBA
services:
  - type: web
    name: everly-clinic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TZ
        value: Asia/Bangkok
