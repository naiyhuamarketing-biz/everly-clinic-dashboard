# Render blueprint — TUBA dashboard
# Required env vars:
#   FB_ACCESS_TOKEN, FB_APP_ID, FB_APP_SECRET, FB_ACCOUNT_TUBA
#   LINE_CHANNEL_ACCESS_TOKEN, LINE_GROUP_ID_TUBA
services:
  - type: web
    name: tuba-ads-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FB_ACCOUNT_TUBA
        value: "1979003202592442"
      - key: MOCK_MODE
        value: "false"
