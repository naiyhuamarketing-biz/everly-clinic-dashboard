# Render blueprint — Everly Clinic dashboard
# Env vars set via Render dashboard (NOT committed):
#   FB_ACCESS_TOKEN, FB_APP_ID, FB_APP_SECRET, FB_ACCOUNT_EVERLY
#   LINE_CHANNEL_ACCESS_TOKEN, LINE_GROUP_ID_EVERLY, LINE_CHANNEL_SECRET
#   LINE_GROUP_ID_EVERLY_FRONT (customer/front group; sends only after CF)
#   CRON_SECRET (same value as GitHub Actions secret)
services:
  - type: web
    name: everly-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TZ
        value: Asia/Bangkok
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_APP_ID
        sync: false
      - key: FB_APP_SECRET
        sync: false
      - key: FB_ACCOUNT_EVERLY
        value: "1965556974211662"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_GROUP_ID_EVERLY
        sync: false
      - key: LINE_GROUP_ID_EVERLY_FRONT
        sync: false
      - key: LINE_GROUP_NAME_EVERLY_FRONT
        value: "หน้าบ้าน Everly"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
